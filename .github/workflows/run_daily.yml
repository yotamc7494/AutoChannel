name: Trigger Streamlit Webhook

on:
  schedule:
    # 1. 12:14 UTC (08:14 EDT / 15:14 ישראל) - בוקר לפני פתיחת מסחר (כל יום)
    # בימי מסחר: update_video | בסוף שבוע / ימי סגירה: vs_video
    - cron: '14 12 * * *'

    # 2. 17:25 UTC (13:25 EDT / 20:25 ישראל) - שעה ויראלית באמצע היום (כל יום) -> vs_video
    - cron: '25 17 * * *'

    # 3. 22:21 UTC (18:21 EDT / 01:21 ישראל) - סגירת מסחר + שעה (שעה אחרי הסרטון של מיכה, שני-שישי) -> daily_summery
    - cron: '21 22 * * 1-5'

  workflow_dispatch:
    inputs:
      video_type:
        description: 'בחר סוג סרטון להרצה ידנית'
        required: true
        default: 'vs_video'
        type: choice
        options:
          - vs_video
          - update_video
          - daily_summery
          - weekly_summary

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Trigger Streamlit App
        env:
          MANUAL_VIDEO_TYPE: ${{ github.event.inputs.video_type }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          python -c "
          import os
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          manual_input = os.environ.get('MANUAL_VIDEO_TYPE', '').strip()

          if manual_input:
              video_type = manual_input
          else:
              now_et = datetime.now(ZoneInfo('America/New_York'))
              weekday = now_et.weekday()  # 0=שני, 1=שלישי, ..., 4=שישי, 5=שבת, 6=ראשון
              hour = now_et.hour
              is_trading_day = weekday < 5  # ימי מסחר (שני עד שישי)

              if hour >= 17:
                  # הרצת סוף יום (22:21 UTC / 18:21 EDT - שעה אחרי מיכה)
                  if is_trading_day:
                      video_type = 'daily_summery'
                  else:
                      video_type = 'vs_video'
              elif hour < 11:
                  # הרצת בוקר לפני פתיחת מסחר (12:14 UTC / 08:14 EDT)
                  if is_trading_day:
                      video_type = 'update_video'
                  else:
                      # בימים שהשוק סגור -> מריץ vs_video
                      video_type = 'vs_video'
              else:
                  # שעה ויראלית באמצע היום (17:25 UTC / 13:25 EDT) -> vs_video
                  video_type = 'vs_video'

          token = os.environ.get('WEBHOOK_TOKEN', '')
          url = f'https://autochannel-stockmarketnews.streamlit.app/?WEBHOOK_TOKEN={token}&video_type={video_type}'
          print(f'🚀 Opening {url} (Type: {video_type}) in Headless Chrome...')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url)
              time.sleep(15)
              print(f'✅ Page triggered successfully for {video_type}!')
          "
